name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup WireGuard Maven credentials
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=${{ github.actor }}" >> ~/.gradle/gradle.properties
          echo "gpr.key=${{ secrets.GH_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Pro-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPN Pro v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## VPN Pro APK
            Debug build — ready to install.

            ### تثبيت:
            1. حمّل الـ APK
            2. فعّل "مصادر غير معروفة" في الإعدادات
            3. ثبّت وأضف google-services.json الخاص بك لاحقاً
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
