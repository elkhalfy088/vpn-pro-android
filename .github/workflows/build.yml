name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" 2>&1 | grep -E "^(Installed|Error)" || true
          echo "NDK_DIR=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Cache WireGuard tunnel AAR
        id: wg-cache
        uses: actions/cache@v4
        with:
          path: wireguard-tunnel.aar
          key: wireguard-tunnel-latest-ndk28-submodules-v1

      - name: Clone and build WireGuard tunnel
        if: steps.wg-cache.outputs.cache-hit != 'true'
        run: |
          TAG=$(git ls-remote --tags https://github.com/WireGuard/wireguard-android.git \
            | awk -F'refs/tags/' '{print $2}' \
            | grep -v '\^{}' \
            | grep '^[0-9]' \
            | sort -V | tail -1)
          echo "Using WireGuard Android tag: $TAG"

          git clone --depth 1 --branch "$TAG" --recurse-submodules \
            https://github.com/WireGuard/wireguard-android.git /tmp/wg-android

          cd /tmp/wg-android
          printf "sdk.dir=%s\nndk.dir=%s\n" \
            "$ANDROID_HOME" "$ANDROID_HOME/ndk/28.2.13676358" > local.properties
          chmod +x gradlew
          ./gradlew :tunnel:assembleRelease --no-daemon -q
          AAR=$(find tunnel/build/outputs/aar -name "*.aar" | head -1)
          echo "Built AAR: $AAR ($(du -sh $AAR | cut -f1))"
          cp "$AAR" "$GITHUB_WORKSPACE/wireguard-tunnel.aar"

      - name: Copy WireGuard AAR to libs
        run: |
          mkdir -p app/libs
          cp wireguard-tunnel.aar app/libs/
          ls -lh app/libs/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Pro-v2-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "VPN Pro v2.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## ✅ VPN Pro v2.0 — جاهز للتحميل

            ### 🆕 مميزات الإصدار الجديد:
            - ✅ **استيراد Config** — استورد إعدادات WireGuard من الحافظة مباشرة
            - ✅ **بحث في السيرفرات** — ابحث بالاسم أو الموقع
            - ✅ **Kill Switch** — يقطع الإنترنت إذا انقطع VPN
            - ✅ **عداد المستخدمين** — يظهر عدد من اتصلوا بكل سيرفر
            - ✅ **DNS متعدد** — Cloudflare / Google / Quad9 / AdGuard
            - ✅ **واجهة محسّنة** — تحريكات وألوان أفضل
            - ✅ **رسائل خطأ واضحة** — يظهر سبب فشل الاتصال
            - ✅ **MTU قابل للتخصيص** — لحل مشاكل الاتصال

            ### 📱 التثبيت:
            1. حمّل `app-debug.apk` من الأسفل
            2. فعّل **"تثبيت من مصادر غير معروفة"** في إعدادات الهاتف
            3. ثبّت التطبيق
            4. أضف سيرفراتك من **Servers → Add**

            ### ⚡ لتجاوز جميع القيود:
            تأكد أن **Allowed IPs = `0.0.0.0/0, ::/0`** ليمر كل الترافيك عبر VPN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
