name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Setup WireGuard Maven credentials
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=${{ github.repository_owner }}" >> ~/.gradle/gradle.properties
          echo "gpr.key=${{ secrets.GITHUB_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Pro-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPN Pro v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## ✅ VPN Pro APK جاهز للتحميل

            تطبيق VPN Pro مبني بـ WireGuard + Firebase

            ### تثبيت:
            1. حمّل الـ APK من الملفات أسفله
            2. فعّل "مصادر غير معروفة" في إعدادات Android
            3. ثبّت التطبيق
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
