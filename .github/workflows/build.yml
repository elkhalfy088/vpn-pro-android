name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" 2>&1 | grep -E "(Installed|Error)" || true
          echo "NDK_DIR=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Cache WireGuard tunnel AAR
        id: wg-cache
        uses: actions/cache@v4
        with:
          path: wireguard-tunnel.aar
          key: wireguard-tunnel-1.0.20230213-ndk25

      - name: Clone and build WireGuard tunnel
        if: steps.wg-cache.outputs.cache-hit != 'true'
        run: |
          # Find the right tag
          TAG=$(git ls-remote --tags https://github.com/WireGuard/wireguard-android.git \
            | grep -o 'refs/tags/[0-9].*' | sort -V | tail -1 | sed 's|refs/tags/||')
          echo "Using WireGuard Android tag: $TAG"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/WireGuard/wireguard-android.git /tmp/wg-android

          cd /tmp/wg-android
          printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "${{ env.NDK_DIR }}" > local.properties
          chmod +x gradlew
          ./gradlew :tunnel:assembleRelease --no-daemon -q 2>&1 | tail -20
          AAR=$(find /tmp/wg-android/tunnel/build/outputs/aar -name "*.aar" | head -1)
          echo "Built AAR: $AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/wireguard-tunnel.aar"

      - name: Copy WireGuard AAR
        run: |
          mkdir -p app/libs
          cp wireguard-tunnel.aar app/libs/wireguard-tunnel.aar
          ls -lh app/libs/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Pro-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPN Pro v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## ✅ VPN Pro APK جاهز للتحميل

            ### تثبيت:
            1. حمّل `app-debug.apk`
            2. فعّل "مصادر غير معروفة" في الإعدادات
            3. ثبّت وأضف سيرفراتك من **Servers → Add**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
