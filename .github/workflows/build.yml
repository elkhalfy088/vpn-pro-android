name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" 2>&1 | grep -E "^(Installed|Error)" || true
          echo "NDK_DIR=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      # ── WireGuard AAR ─────────────────────────────────────────────────────
      - name: Cache WireGuard tunnel AAR
        id: wg-cache
        uses: actions/cache@v4
        with:
          path: wireguard-tunnel.aar
          key: wireguard-tunnel-latest-ndk28-v2

      - name: Build WireGuard tunnel AAR
        if: steps.wg-cache.outputs.cache-hit != 'true'
        run: |
          TAG=$(git ls-remote --tags https://github.com/WireGuard/wireguard-android.git \
            | awk -F'refs/tags/' '{print $2}' \
            | grep -v '\^{}' \
            | grep '^[0-9]' \
            | sort -V | tail -1)
          echo "Using WireGuard Android tag: $TAG"
          git clone --depth 1 --branch "$TAG" --recurse-submodules \
            https://github.com/WireGuard/wireguard-android.git /tmp/wg-android
          cd /tmp/wg-android
          printf "sdk.dir=%s\nndk.dir=%s\n" \
            "$ANDROID_HOME" "$ANDROID_HOME/ndk/28.2.13676358" > local.properties
          chmod +x gradlew
          ./gradlew :tunnel:assembleRelease --no-daemon -q
          AAR=$(find tunnel/build/outputs/aar -name "*.aar" | head -1)
          echo "Built WireGuard AAR: $AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/wireguard-tunnel.aar"

      # ── AndroidLibXrayLite (Xray-core for Android) ────────────────────────
      - name: Cache libv2ray AAR
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: libv2ray.aar
          key: libv2ray-xray-26-v3

      - name: Download libv2ray AAR (AndroidLibXrayLite)
        if: steps.xray-cache.outputs.cache-hit != 'true'
        run: |
          # Get latest release of AndroidLibXrayLite
          XRAY_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest \
            | grep "browser_download_url" \
            | grep "libv2ray.aar" \
            | cut -d '"' -f 4 \
            | head -1)

          if [ -z "$XRAY_URL" ]; then
            # Fallback: known working release
            XRAY_URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/26.0.0/libv2ray.aar"
          fi

          echo "Downloading libv2ray from: $XRAY_URL"
          curl -L -o libv2ray.aar "$XRAY_URL"
          ls -lh libv2ray.aar

      - name: Copy AARs to app/libs
        run: |
          mkdir -p app/libs
          cp wireguard-tunnel.aar app/libs/
          cp libv2ray.aar app/libs/
          ls -lh app/libs/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNPro-v3-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: "VPN Pro v3.1.${{ github.run_number }} — إصلاح الأعطال + زر النجمة"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## ✅ VPN Pro v3.1 — إصلاح الأعطال + زر النجمة ⭐

            ### 🔧 الإصلاحات في v3.1:
            - ✅ **إصلاح الخروج المفاجئ** — عند الضغط على سيرفرات مجانية أو أي زر تنقل
            - ✅ **إصلاح إذن VPN** — التطبيق يطلب إذن VPN بشكل صحيح قبل الاتصال
            - ✅ **إصلاح الضغط المزدوج** — منع استدعاء Connect مرتين في نفس الوقت
            - ✅ **زر النجمة ⭐** — أضف أي سيرفر للمفضلة، فلترة المفضلة من الأعلى
            - ✅ **ترتيب السيرفرات** — المفضلة تظهر أولاً في القائمة
            - ✅ **رسائل خطأ أوضح** — عند فشل الاتصال يظهر سبب المشكلة

            ### 📱 طريقة الاستخدام للإنترنت المجاني:
            1. افتح التطبيق → **سيرفرات مجانية** (الزر الأخضر أو أيقونة الكرة)
            2. اضغط **Refresh** لجلب أحدث السيرفرات
            3. اضغط **Connect** على أي سيرفر
            4. وافق على طلب إذن VPN إذا ظهر
            5. إذا لم يشتغل، جرب سيرفراً آخر

            ### 📥 التثبيت:
            1. حمّل `app-debug.apk` من الأسفل
            2. فعّل **"تثبيت من مصادر غير معروفة"** في إعدادات الهاتف
            3. ثبّت التطبيق وافتحه
