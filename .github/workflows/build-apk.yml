name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build APK with Expo + Gradle

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Expo prebuild (Android)
        working-directory: artifacts/vpn-pro-android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN || 'localhost' }}

      - name: Build APK with Gradle
        working-directory: artifacts/vpn-pro-android/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find artifacts/vpn-pro-android/android -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-pro-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: VPN Pro v${{ github.run_number }}
          body: |
            ## VPN Pro Android APK
            
            Download the APK below and install it on your Android device.
            
            > Enable "Install from unknown sources" in Android settings before installing.
            
            ### What's included
            - V2Ray / VMess / VLESS support
            - Trojan, Shadowsocks, Hysteria2
            - HTTP Proxy & SOCKS5
            - Shared server list across all users
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
