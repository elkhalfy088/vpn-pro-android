kind = "mobile"
previewPath = "/"
title = "VPN Pro"
version = "1.0.0"
id = "artifacts/vpn-pro-android"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24608

[services.development]
run = "pnpm --filter @workspace/vpn-pro-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vpn-pro-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vpn-pro-android", "run", "serve" ]

[services.env]
PORT = "24608"
BASE_PATH = "/"
